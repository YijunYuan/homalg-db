workspace:
  name: homalg-db
  state_dir: .archon-horizon
  rounds: 1
  manage_gitignore: false
  horizon_agent: {harness: primary}
  # Three concurrent lanes; see docs/PARALLEL_WORKFLOW.md#concurrent-lanes.
  session_ledger: true
  # Regenerated by the after-session hook; isolated sessions never land them.
  session_generated: [HomAlg.lean, HomAlg/*.lean, literature/*/nodes.json]
  scheduler: {max_parallel_sessions: 3}
  # The planner keeps a long pipeline queue on purpose; warn only beyond this.
  health: {open_tasks: 400}
  hooks:
    before_round:
      - homalg blueprint-tex --active
      - homalg private-snapshot
    after_session:
      - homalg after-session --task {task_id} --session {session_dir} --since {start_sha} --until {end_sha}
  delegation: {allow_launch_tasks: false, allow_launch_runs: false}
external_libraries:
  - name: mathlib
harnesses: {}
github: {enabled: false}
projects:
  HomAlg:
    path: .
    type: lean
    blueprint: {path: blueprint/src}
    build: {command: homalg build-active}
